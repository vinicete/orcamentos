services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orcamento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orcamento}
      POSTGRES_DB: ${POSTGRES_DB:-orcamento}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - orcamento_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-orcamento}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orcamento_pgdata:
